name: valvue3
services:
  diagnostic:
    image: ${DIAGNOSTIC_IMAGE:-valvue3-runtime:0.1.3}
    platform: linux/amd64
    build:
      context: .
      target: ${RUNTIME_TARGET:-runtime}
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.159.2}
        WPS_DEB_SHA256: ${WPS_DEB_SHA256:-}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ${PROJECTS_DIR:-./离线诊断/projects}
        target: /workspace/离线诊断/projects
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR:-./.runtime}/codex
        target: /home/diagnostic/.codex
        bind: {create_host_path: false}
