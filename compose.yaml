name: valvue3
services:
  ocr:
    image: ${OCR_IMAGE:-valvue3-ocr:docker-v1}
    platform: linux/amd64
    build:
      context: .
      target: ocr
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    init: false # tini is already the image entrypoint
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 2gb
    environment:
      OMP_NUM_THREADS: ${OCR_THREADS:-4}
    volumes:
      - type: bind
        source: ${STATE_DIR:-./.runtime}/models
        target: /opt/models
        bind: {create_host_path: false}
    # Loopback only, no host port. Runtime joins this network namespace.
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8765/ready',timeout=5))['ready'] is True"]
      interval: 15s
      timeout: 10s
      start_period: 30m
      retries: 4
  diagnostic:
    image: ${DIAGNOSTIC_IMAGE:-valvue3-runtime:docker-v1}
    platform: linux/amd64
    build:
      context: .
      target: ${RUNTIME_TARGET:-runtime}
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.159.2}
        WPS_DEB_SHA256: ${WPS_DEB_SHA256:-}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:ocr
    depends_on:
      ocr: {condition: service_healthy}
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ${PROJECTS_DIR:-./projects}
        target: /workspace/离线诊断/projects
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR:-./.runtime}/codex
        target: /home/diagnostic/.codex
        bind: {create_host_path: false}
